<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' - 农芯溯源'">错误</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f0f4f0, #e8f5e9); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 48px 40px; text-align: center; max-width: 420px; width: 90%; }
        .error-code { font-size: 72px; font-weight: bold; color: #2E7D32; line-height: 1; margin-bottom: 8px; }
        .error-title { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .error-msg { color: #666; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-primary { background: #2E7D32; color: #fff; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; }
        .btn-primary:hover { background: #1B5E20; color: #fff; }
        .btn-secondary { background: #fff; color: #2E7D32; border: 1px solid #2E7D32; padding: 10px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; cursor: pointer; }
        .btn-secondary:hover { background: #f0f4f0; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code" th:text="${status}">404</div>
    <div class="error-title" th:text="${error}">页面不存在</div>
    <div class="error-msg" th:text="${message}">您访问的页面不存在或已被移除</div>
    <div class="btn-group">
        <button class="btn-secondary" onclick="history.back()">← 返回上一页</button>
        <a href="/" class="btn-primary">回到首页</a>
    </div>
</div>
</body>
</html>
