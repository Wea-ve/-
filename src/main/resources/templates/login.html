<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>农芯溯源 - 农产品全链路溯源管理平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 45%, #43A047 100%);
            background-image: linear-gradient(rgba(15, 45, 20, .35), rgba(15, 45, 20, .35)), url('/img/login-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* ===== 整体登录容器 ===== */
        .login-wrap {
            width: 100%;
            max-width: 440px;
        }

        /* ===== 品牌头部 ===== */
        .brand-head {
            text-align: center;
            margin-bottom: 22px;
        }
        .brand-logo {
            font-size: 56px;
            line-height: 1;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
        }
        .brand-title {
            color: #fff;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 6px;
            margin: 10px 0 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,.3);
        }
        .brand-sub {
            color: rgba(255,255,255,.82);
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* ===== 毛玻璃登录卡片 ===== */
        .login-card {
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 16px 50px rgba(27, 60, 30, 0.35);
            overflow: hidden;
        }

        /* ===== 角色切换标签 ===== */
        .role-tabs {
            display: flex;
            background: rgba(255,255,255,.35);
            border-bottom: 1px solid rgba(255,255,255,.5);
        }
        .role-tab {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            cursor: pointer;
            color: #4A5D4E;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all .25s ease;
            position: relative;
            user-select: none;
        }
        .role-tab .tab-icon { font-size: 18px; margin-right: 4px; vertical-align: middle; }
        .role-tab:hover { background: rgba(255,255,255,.3); color: #2E7D32; }
        .role-tab.active {
            color: #fff;
            background: linear-gradient(135deg, #43A047, #2E7D32);
        }
        .role-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 3px;
            background: #FFD54F;
            border-radius: 3px 3px 0 0;
        }

        /* ===== 表单区域 ===== */
        .form-area { padding: 30px 34px 26px; }

        .role-tip {
            text-align: center;
            font-size: 12.5px;
            color: #78909C;
            margin-bottom: 18px;
            padding: 6px 10px;
            background: rgba(255,255,255,.5);
            border-radius: 8px;
            letter-spacing: .5px;
        }
        .role-tip strong { color: #2E7D32; }

        .form-label { color: #4A5D4E; font-size: 13.5px; margin-bottom: 5px; font-weight: 500; }
        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(120, 160, 125, 0.4);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            transition: all .2s ease;
        }
        .form-control:focus {
            background: #fff;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, .18);
        }
        .input-wrap { position: relative; }
        .input-wrap .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #6D8B72;
            font-size: 15px;
            pointer-events: none;
        }
        .input-wrap .form-control { padding-left: 38px; }

        /* ===== 提交按钮 ===== */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #43A047, #1B5E20);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 11px 0;
            font-size: 16px;
            letter-spacing: 8px;
            text-indent: 8px;
            font-weight: 600;
            margin-top: 8px;
            box-shadow: 0 6px 16px rgba(46, 125, 50, .35);
            transition: all .2s ease;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #388E3C, #1B5E20);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, .45);
            color: #fff;
        }
        .btn-submit:active { transform: translateY(0); }

        /* ===== 底部信息 ===== */
        .card-foot {
            text-align: center;
            color: rgba(255,255,255,.78);
            font-size: 12px;
            margin-top: 18px;
            line-height: 1.8;
        }
        .card-foot .slogan {
            font-size: 13px;
            letter-spacing: 2px;
            color: #fff;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .test-tip {
            display: inline-block;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11.5px;
            margin-top: 4px;
        }
        .entry-link {
            color: #FFE082;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .entry-link:hover { color: #fff; text-decoration: underline; }

        .alert { font-size: 13px; border-radius: 10px; }
    </style>
</head>
<body>
<div class="login-wrap">
    <!-- 品牌头部 -->
    <div class="brand-head">
        <div class="brand-logo">🌾</div>
        <div class="brand-title">农芯溯源</div>
        <div class="brand-sub">农产品全链路溯源管理平台</div>
    </div>

    <!-- 登录卡片 -->
    <div class="login-card">
        <!-- 角色切换标签 -->
        <div class="role-tabs" id="roleTabs">
            <div class="role-tab" th:classappend="${selectedRole == null or selectedRole == 'farmer'} ? 'active'" data-role="farmer"><span class="tab-icon">🧑‍🌾</span>农户</div>
            <div class="role-tab" th:classappend="${selectedRole == 'dealer'} ? 'active'" data-role="dealer"><span class="tab-icon">🚚</span>经销商</div>
            <div class="role-tab" th:classappend="${selectedRole == 'admin'} ? 'active'" data-role="admin"><span class="tab-icon">🛡️</span>管理员</div>
        </div>

        <div class="form-area">
            <div th:if="${error}" class="alert alert-danger py-2 text-center" th:text="${error}"></div>

            <!-- 角色提示 -->
            <div class="role-tip" id="roleTip">
                当前登录：<strong id="roleName" th:text="${selectedRole == 'dealer'} ? '经销商' : (${selectedRole == 'admin'} ? '管理员' : '农户')">农户</strong>通道 · 仅本角色账号可登录
            </div>

            <form method="post" action="/login" id="loginForm">
                <input type="hidden" name="role" id="roleInput" th:value="${selectedRole != null} ? ${selectedRole} : 'farmer'">
                <div class="mb-3">
                    <label class="form-label">账号</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" name="username" class="form-control" placeholder="请输入账号" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn-submit">登 录</button>
            </form>
        </div>
    </div>

    <!-- 底部 -->
    <div class="card-foot">
        <div class="slogan">从田间到餐桌 · 每一步都可信</div>
        <div class="test-tip">
            测试账号：farmer01 / dealer01 / admin　密码均为 123456
        </div>
        <div class="consumer-entry mt-2">
            <a href="/complaint/new" class="entry-link">📢 我要投诉</a>
            <span class="mx-2">·</span>
            <a href="/complaint/query" class="entry-link">🔍 投诉查询</a>
        </div>
    </div>
</div>

<script>
    // 角色标签切换，互不干扰
    const roleMap = {
        farmer: { name: '农户', icon: '🧑‍🌾' },
        dealer: { name: '经销商', icon: '🚚' },
        admin:  { name: '管理员', icon: '🛡️' }
    };
    const tabs = document.querySelectorAll('.role-tab');
    const roleInput = document.getElementById('roleInput');
    const roleName  = document.getElementById('roleName');
    const usernameInput = document.querySelector('input[name="username"]');
    const passwordInput = document.querySelector('input[name="password"]');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const role = tab.dataset.role;
            roleInput.value = role;
            roleName.textContent = roleMap[role].name;
            // 切换通道时清空已输入内容，避免账号串用
            usernameInput.value = '';
            passwordInput.value = '';
        });
    });
</script>
</body>
</html>
