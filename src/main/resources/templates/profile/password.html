<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout" th:with="role=${session.loginUser.role}">
    <div th:replace="~{fragments/layout :: sidebar(${role}, 'password')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('个人中心','修改密码')}"></div>
        <main class="main-content">
            <h4 class="page-title">修改密码</h4>
            <div class="card">
                <div class="card-body" style="max-width: 480px;">
                    <div th:if="${param.success}" class="alert alert-success">密码修改成功，下次登录请使用新密码</div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/profile/password" onsubmit="return checkPwd()">
                        <div class="mb-3">
                            <label class="form-label">原密码 <span class="text-danger">*</span></label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">新密码 <span class="text-danger">*</span></label>
                            <input type="password" name="newPassword" id="newPassword" class="form-control"
                                   placeholder="至少 6 位" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                            <div class="invalid-feedback">两次输入的新密码不一致</div>
                        </div>
                        <button type="submit" class="btn btn-success">确认修改</button>
                        <a href="/profile" class="btn btn-outline-secondary">返 回</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    function checkPwd() {
        var a = document.getElementById('newPassword').value;
        var b = document.getElementById('confirmPassword').value;
        if (a !== b) {
            alert('两次输入的新密码不一致');
            return false;
        }
        return true;
    }
</script>
</body>
</html>
