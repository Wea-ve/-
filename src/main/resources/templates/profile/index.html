<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout" th:with="role=${session.loginUser.role}">
    <div th:replace="~{fragments/layout :: sidebar(${role}, 'profile')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('个人中心','个人信息')}"></div>
        <main class="main-content">
            <h4 class="page-title">个人信息</h4>

            <div th:if="${param.success}" class="alert alert-success">保存成功</div>
            <div th:if="${param.error != null and param.error[0] == 'type'}" class="alert alert-danger">头像仅支持 PNG / JPG / GIF 格式</div>
            <div th:if="${param.error != null and param.error[0] == 'empty'}" class="alert alert-danger">请先选择要上传的头像文件</div>

            <div class="row">
                <!-- 头像卡片 -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <span class="avatar avatar-lg d-inline-flex my-3"
                                  th:replace="~{fragments/layout :: avatar(${user}, 'lg')}"></span>
                            <h5 class="mt-2 mb-1" th:text="${user.realName}">姓名</h5>
                            <div class="text-muted small mb-3"
                                 th:text="${user.role == 'admin'} ? '系统管理员' :
                                       (${user.role == 'farmer'} ? '农户' : '经销商')">角色</div>
                            <form method="post" action="/profile/avatar" enctype="multipart/form-data">
                                <input type="file" name="file" class="form-control form-control-sm mb-2"
                                       accept="image/png,image/jpeg,image/gif" required>
                                <button type="submit" class="btn btn-outline-success btn-sm w-100">上传/更换头像</button>
                            </form>
                            <div class="form-text mt-2">支持 PNG / JPG / GIF，建议正方形图片</div>
                        </div>
                    </div>
                </div>

                <!-- 资料卡片 -->
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-header">基本资料</div>
                        <div class="card-body" style="max-width: 560px;">
                            <form method="post" action="/profile">
                                <div class="mb-3">
                                    <label class="form-label">登录账号</label>
                                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                                    <div class="form-text">账号为登录凭证，不支持自行修改，如需变更请联系管理员</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">登录密码</label>
                                    <input type="text" class="form-control" value="••••••••" disabled>
                                    <div class="form-text">密码加密存储，任何人都无法查看；如遗忘请
                                        <a href="/profile/password">修改密码</a>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">真实姓名 / 企业名 <span class="text-danger">*</span></label>
                                    <input type="text" name="realName" class="form-control" th:value="${user.realName}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">联系电话</label>
                                    <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">地址</label>
                                    <input type="text" name="address" class="form-control" th:value="${user.address}">
                                </div>
                                <button type="submit" class="btn btn-success">保存修改</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
