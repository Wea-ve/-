<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>农芯溯源 - 溯源详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .top-banner { background: linear-gradient(135deg,#2E7D32,#1B5E20); color:#fff; padding:20px; text-align:center; }
        .brand { font-size: 13px; letter-spacing: 2px; opacity: .85; margin-bottom: 8px; }
        .chain-step { border-left: 3px solid #2E7D32; padding-left: 15px; margin-bottom: 15px; }
        .badge-green { background:#2E7D32; }
        /* 可信徽章 */
        .trust-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.18); padding: 8px 18px; border-radius: 20px; font-size: 14px; margin-top: 12px; border: 1px solid rgba(255,255,255,0.35); }
        .trust-badge .check { width: 20px; height: 20px; background: #fff; color: #2E7D32; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
        /* AI 浮动聊天窗 */
        .ai-fab { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg,#2E7D32,#1B5E20); color: #fff; border: none; box-shadow: 0 4px 16px rgba(46,125,50,.4); cursor: pointer; font-size: 24px; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
        .ai-fab:hover { transform: scale(1.1); }
        .ai-chat { position: fixed; right: 24px; bottom: 24px; width: 360px; max-width: 90vw; height: 480px; max-height: 70vh; background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.15); z-index: 10000; display: none; flex-direction: column; overflow: hidden; }
        .ai-chat.open { display: flex; }
        .ai-chat-header { background: linear-gradient(135deg,#2E7D32,#1B5E20); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .ai-chat-header span { font-size: 15px; font-weight: 600; }
        .ai-chat-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: .8; }
        .ai-chat-close:hover { opacity: 1; }
        .ai-chat-body { flex: 1; overflow-y: auto; padding: 16px; }
        .ai-msg { margin-bottom: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.5; }
        .ai-msg.user { margin-left: auto; background: #E8F5E9; padding: 8px 14px; border-radius: 12px 12px 2px 12px; }
        .ai-msg.bot { background: #f5f5f5; padding: 8px 14px; border-radius: 12px 12px 12px 2px; }
        .ai-chat-input { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
        .ai-chat-input input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
        .ai-chat-input button { background: #2E7D32; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; white-space: nowrap; }
        .ai-chat-input button:hover { background: #1B5E20; }
        .ai-typing { color: #999; font-style: italic; }

        /* ===== 手机端适配 ===== */
        @media (max-width: 768px) {
            .top-banner { padding: 14px; }
            .top-banner h2 { font-size: 20px; }
            .brand { font-size: 11px; letter-spacing: 1px; }
            .trust-badge { font-size: 12px; padding: 6px 12px; }
            .container { padding: 0 10px !important; margin-top: 10px !important; }
            .card { margin-bottom: 10px !important; }
            .card-body { padding: 12px !important; }
            .card h5 { font-size: 15px; }
            .chain-step { margin-bottom: 10px; }
            /* AI 聊天窗全屏适配 */
            .ai-chat { right: 8px; bottom: 8px; width: calc(100vw - 16px); height: calc(100vh - 100px); max-height: none; border-radius: 12px; }
            .ai-fab { right: 16px; bottom: 16px; width: 52px; height: 52px; font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="top-banner">
    <div class="brand">🌾 农芯溯源 · 农产品全链路溯源</div>
    <h2>🌾 <span th:text="${batch.cropName}"></span></h2>
    <p class="mb-0">溯源码：<span th:text="${batch.traceCode}"></span></p>
    <div class="trust-badge">
        <span class="check">✓</span>
        <span>本记录已上链，共经过 <strong th:text="${nodeCount}">0</strong> 个节点确认 · 数据签名校验通过</span>
    </div>
</div>

<div class="container mt-3" style="max-width:600px">

    <div th:if="${complained != null}" class="alert alert-success">投诉已提交，我们会尽快处理</div>

    <div class="card mb-3">
        <div class="card-body">
            <h5>📍 产地信息</h5>
            <p class="mb-1">产地：<span th:text="${batch.landLocation}"></span></p>
            <p class="mb-1">种植农户：<span th:text="${batch.farmerName}"></span></p>
            <p class="mb-0">联系电话：<span th:text="${batch.farmerPhone}"></span></p>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5>📋 种植全流程记录</h5>
            <div th:each="l : ${logs}" class="chain-step">
                <span class="badge bg-secondary"
                      th:text="${l.logType} == 'SOWING' ? '播种' :
                                (${l.logType} == 'FERTILIZE' ? '施肥' :
                                (${l.logType} == 'PESTICIDE' ? '打药' :
                                (${l.logType} == 'IRRIGATE' ? '灌溉' : '除草')))"></span>
                <small class="text-muted" th:text="${l.logDate}"></small>
                <p class="mb-0" th:text="${l.content}"></p>
                <p class="text-muted small mb-0" th:if="${l.material != null}">
                    使用物料：<span th:text="${l.material}"></span> ｜ 用量：<span th:text="${l.dosage}"></span>
                </p>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5>🔬 检测报告</h5>
            <div th:if="${reports.isEmpty()}" class="text-muted">暂无检测报告</div>
            <div th:each="r : ${reports}">
                <p class="mb-1">报告编号：<span th:text="${r.reportNo}"></span></p>
                <p class="mb-1">检测机构：<span th:text="${r.institution}"></span></p>
                <p class="mb-1">检测结果：<span class="badge bg-success" th:text="${r.result}"></span></p>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5>🚚 流转路径</h5>
            <div th:each="r : ${records}" class="chain-step">
                <span class="badge bg-info"
                      th:text="${r.type} == 'HARVEST' ? '采收' :
                                (${r.type} == 'INBOUND' ? '经销商入库' :
                                (${r.type} == 'OUTBOUND' ? '出库' : '销售'))"></span>
                <small class="text-muted" th:text="${r.operateTime}"></small>
                <p class="mb-0" th:text="${r.location}"></p>
                <p class="mb-0 text-muted small" th:text="${r.remark}"></p>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5>📢 投诉反馈</h5>
            <form method="post" action="/complaint">
                <input type="hidden" name="batchId" th:value="${batch.id}">
                <div class="mb-2">
                    <input type="text" name="complainant" class="form-control" placeholder="您的称呼" required>
                </div>
                <div class="mb-2">
                    <input type="text" name="phone" class="form-control" placeholder="联系电话" required>
                </div>
                <div class="mb-2">
                    <select name="type" class="form-select">
                        <option>品质问题</option>
                        <option>农残担忧</option>
                        <option>假冒问题</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="mb-2">
                    <textarea name="content" class="form-control" rows="2" placeholder="请描述问题" required></textarea>
                </div>
                <button type="submit" class="btn btn-danger btn-sm">提交投诉</button>
            </form>
        </div>
    </div>
</div>

<!-- AI 问答浮动窗 -->
<button class="ai-fab" id="aiFab" onclick="toggleChat()">💬</button>
<div class="ai-chat" id="aiChat">
    <div class="ai-chat-header">
        <span>🌾 溯源助手</span>
        <button class="ai-chat-close" onclick="toggleChat()">×</button>
    </div>
    <div class="ai-chat-body" id="aiChatBody">
        <div class="ai-msg bot">您好！我是溯源助手，可以回答关于这批<span th:text="${batch.cropName}"></span>的问题，比如：打了几次农药？怎么保存？检测结果？</div>
    </div>
    <div class="ai-chat-input">
        <input type="text" id="aiInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter') sendQuestion()">
        <button onclick="sendQuestion()">发送</button>
    </div>
</div>
<script>
    const batchId = '[[${batch.id}]]';
    function toggleChat() {
        const chat = document.getElementById('aiChat');
        const fab = document.getElementById('aiFab');
        chat.classList.toggle('open');
        fab.style.display = chat.classList.contains('open') ? 'none' : 'flex';
        if (chat.classList.contains('open')) {
            document.getElementById('aiInput').focus();
        }
    }
    function sendQuestion() {
        const input = document.getElementById('aiInput');
        const q = input.value.trim();
        if (!q) return;
        const body = document.getElementById('aiChatBody');
        // 显示用户消息
        const userDiv = document.createElement('div');
        userDiv.className = 'ai-msg user';
        userDiv.textContent = q;
        body.appendChild(userDiv);
        input.value = '';
        // 显示"思考中"
        const typing = document.createElement('div');
        typing.className = 'ai-msg bot ai-typing';
        typing.id = 'typing';
        typing.textContent = '正在思考...';
        body.appendChild(typing);
        body.scrollTop = body.scrollHeight;
        // 调后端
        fetch('/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batchId: Number(batchId), question: q })
        })
        .then(r => r.json())
        .then(data => {
            typing.remove();
            const botDiv = document.createElement('div');
            botDiv.className = 'ai-msg bot';
            botDiv.textContent = data.reply || '抱歉，没能理解您的问题';
            body.appendChild(botDiv);
            body.scrollTop = body.scrollHeight;
        })
        .catch(() => {
            typing.remove();
            const errDiv = document.createElement('div');
            errDiv.className = 'ai-msg bot';
            errDiv.textContent = '网络异常，请稍后重试';
            body.appendChild(errDiv);
        });
    }
</script>
</body>
</html>
