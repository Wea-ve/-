<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">
    <style>
        .role-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .role-tab {
            padding: 10px 22px; cursor: pointer; font-weight: 600; font-size: 14px;
            color: #6c757d; border-bottom: 3px solid transparent; margin-bottom: -2px;
            transition: all .2s; user-select: none;
        }
        .role-tab:hover { color: #2E7D32; }
        .role-tab.active { color: #2E7D32; border-bottom-color: #2E7D32; }
        .role-tab .count {
            display: inline-block; background: #e9ecef; color: #495057;
            border-radius: 10px; padding: 1px 8px; font-size: 12px; margin-left: 4px;
        }
        .role-tab.active .count { background: #2E7D32; color: #fff; }
        .search-form { display: flex; gap: 8px; max-width: 500px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'users')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('系统管理','用户管理')}"></div>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="page-title mb-0">账号管理</h4>
                <a href="/admin/users/add" class="btn btn-success btn-sm">+ 新增账号</a>
            </div>

            <!-- 角色切换标签 -->
            <div class="role-tabs" id="roleTabs">
                <div class="role-tab" th:classappend="${role == null or role == ''} ? 'active'"
                     onclick="switchRole('')">
                    全部账号<span class="count" th:text="${allCount}">0</span>
                </div>
                <div class="role-tab" th:classappend="${role == 'farmer'} ? 'active'"
                     onclick="switchRole('farmer')">
                    🧑‍🌾 农户<span class="count" th:text="${farmerCount}">0</span>
                </div>
                <div class="role-tab" th:classappend="${role == 'dealer'} ? 'active'"
                     onclick="switchRole('dealer')">
                    🚚 经销商<span class="count" th:text="${dealerCount}">0</span>
                </div>
            </div>

            <!-- 搜索框 -->
            <form method="get" action="/admin/users" class="search-form">
                <input type="hidden" name="role" id="roleInput" th:value="${role}">
                <input type="text" name="keyword" class="form-control"
                       placeholder="搜索账号/姓名/手机号" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a th:href="@{/admin/users(role=${role})}" class="btn btn-outline-secondary">重置</a>
            </form>

            <!-- 账号列表 -->
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr><th>ID</th><th>账号</th><th>姓名</th><th>角色</th><th>电话</th><th>地址</th><th>状态</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.realName}"></td>
                            <td>
                                <span th:if="${u.role=='farmer'}" class="badge bg-success">🧑‍🌾 农户</span>
                                <span th:if="${u.role=='dealer'}" class="badge bg-warning text-dark">🚚 经销商</span>
                            </td>
                            <td th:text="${u.phone}"></td>
                            <td th:text="${u.address}"></td>
                            <td>
                                <span th:if="${u.status==1}" class="badge bg-success">启用</span>
                                <span th:if="${u.status==0}" class="badge bg-secondary">禁用</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(users)}" class="text-center text-muted py-4">
                        暂无账号数据
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    function switchRole(role) {
        const url = new URL(window.location.href);
        url.searchParams.set('role', role);
        url.searchParams.delete('keyword');
        window.location.href = url.toString();
    }
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
