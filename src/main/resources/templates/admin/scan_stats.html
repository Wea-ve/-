<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>扫码统计</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'scan_stats')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('流通监管','扫码统计')}"></div>
        <main class="main-content">
            <h4 class="page-title">扫码统计</h4>
            <div class="row">
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-primary" th:text="${todayCount}">0</h3><p class="mb-0">今日扫码量</p>
                </div></div></div>
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-warning" th:text="${#lists.size(hotBatches)}">0</h3><p class="mb-0">热门批次数</p>
                </div></div></div>
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-success" th:text="${#lists.size(scanLogs)}">0</h3><p class="mb-0">扫码明细记录</p>
                </div></div></div>
            </div>

            <div class="row mt-4">
                <div class="col-md-7">
                    <div class="card">
                        <div class="card-header">📈 近 7 天扫码趋势</div>
                        <div class="card-body"><div id="chartScan" style="height:320px"></div></div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="card">
                        <div class="card-header">🔥 热门批次 TOP 10</div>
                        <div class="card-body">
                            <table class="table table-sm mb-0">
                                <thead><tr><th>排名</th><th>作物</th><th>批次号</th><th>扫码次数</th></tr></thead>
                                <tbody>
                                <tr th:each="b,iter : ${hotBatches}">
                                    <td th:text="${iter.index + 1}"></td>
                                    <td th:text="${b.crop_name}"></td>
                                    <td th:text="${b.batch_no}"></td>
                                    <td><span class="badge bg-success" th:text="${b.cnt}"></span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(hotBatches)}"><td colspan="4" class="text-center text-muted">暂无扫码数据</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">📋 扫码明细（最近 200 条）</div>
                <div class="card-body" style="max-height:400px;overflow-y:auto">
                    <table class="table table-sm table-striped mb-0">
                        <thead><tr><th>时间</th><th>作物</th><th>批次号</th><th>溯源码</th><th>IP</th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${scanLogs}">
                            <td th:text="${s.scanTime}"></td>
                            <td th:text="${s.cropName}"></td>
                            <td th:text="${s.batchNo}"></td>
                            <td th:text="${s.traceCode}"></td>
                            <td th:text="${s.ip}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(scanLogs)}"><td colspan="5" class="text-center text-muted">暂无扫码记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:inline="javascript">
    var scan7days = /*[[${scan7days}]]*/ [];
    var dayMap = {};
    scan7days.forEach(function (d) { dayMap[d.day] = Number(d.cnt) || 0; });
    var days = [];
    for (var i = 6; i >= 0; i--) {
        var d = new Date();
        d.setDate(d.getDate() - i);
        var key = d.toISOString().slice(0, 10);
        days.push({ label: key.slice(5), value: dayMap[key] || 0 });
    }
    var chartScan = echarts.init(document.getElementById('chartScan'));
    chartScan.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 30, top: 30, bottom: 40 },
        xAxis: { type: 'category', data: days.map(d => d.label) },
        yAxis: { type: 'value', name: '扫码次数', minInterval: 1 },
        series: [{
            type: 'line', smooth: true, symbol: 'circle', symbolSize: 8,
            data: days.map(d => d.value),
            itemStyle: { color: '#2E7D32' },
            lineStyle: { width: 3 },
            areaStyle: { color: 'rgba(46,125,50,0.15)' },
            label: { show: true, position: 'top' }
        }]
    });
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
