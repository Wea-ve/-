<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批次总览</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'batches')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('生产监管','批次总览')}"></div>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="page-title mb-0">全平台种植批次</h4>
                <a href="/admin/batches/export" class="btn btn-success btn-sm">📥 导出 Excel</a>
            </div>
            <form method="get" action="/admin/batches" class="d-flex gap-2 mb-3" style="max-width:500px">
                <input type="text" name="keyword" class="form-control" placeholder="搜索批次号/作物名" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a href="/admin/batches" class="btn btn-outline-secondary">重置</a>
            </form>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>品种</th><th>产地</th><th>农户</th><th>播种日期</th><th>采收量(斤)</th><th>状态</th><th>溯源</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${batches}">
                            <td th:text="${b.batchNo}"></td>
                            <td th:text="${b.cropName}"></td>
                            <td th:text="${b.variety}"></td>
                            <td th:text="${b.landLocation}"></td>
                            <td th:text="${b.farmerName}"></td>
                            <td th:text="${b.plantDate}"></td>
                            <td th:text="${b.harvestWeight}"></td>
                            <td>
                                <span th:if="${b.status=='PLANTING'}" class="badge bg-warning">种植中</span>
                                <span th:if="${b.status=='HARVESTED'}" class="badge bg-success">已采收</span>
                                <span th:if="${b.status=='SOLD'}" class="badge bg-secondary">已售罄</span>
                            </td>
                            <td>
                                <a th:if="${b.traceCode != null}" th:href="'/trace/' + ${b.traceCode}" target="_blank"
                                   class="btn btn-sm btn-outline-primary">查看</a>
                                <span th:if="${b.traceCode == null}" class="text-muted">—</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(batches)}"><td colspan="9" class="text-muted text-center">暂无批次</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
