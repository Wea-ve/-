<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>检测报告监管</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'admin_reports')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('生产监管','检测报告监管')}"></div>
        <main class="main-content">
            <h4 class="page-title">全平台检测报告</h4>
            <div class="row mb-3">
                <div class="col-md-3"><div class="card text-center"><div class="card-body">
                    <h3 class="text-success" th:text="${qualifiedCount}">0</h3><p class="mb-0">合格报告</p>
                </div></div></div>
                <div class="col-md-3"><div class="card text-center"><div class="card-body">
                    <h3 class="text-danger" th:text="${unqualifiedCount}">0</h3><p class="mb-0">不合格报告</p>
                </div></div></div>
            </div>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>检测日期</th><th>农户</th><th>批次号</th><th>作物</th><th>报告编号</th><th>检测机构</th><th>结果</th><th>文件</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${reports}">
                            <td th:text="${r.reportDate}"></td>
                            <td th:text="${r.farmerName}"></td>
                            <td th:text="${r.batchNo}"></td>
                            <td th:text="${r.cropName}"></td>
                            <td th:text="${r.reportNo}"></td>
                            <td th:text="${r.institution}"></td>
                            <td>
                                <span class="badge" th:classappend="${r.result == '合格'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${r.result}"></span>
                            </td>
                            <td>
                                <a th:if="${r.reportUrl != null}" th:href="${r.reportUrl}" target="_blank" class="btn btn-sm btn-outline-primary">查看</a>
                                <span th:if="${r.reportUrl == null}" class="text-muted">无</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="8" class="text-muted text-center">暂无检测报告</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
