<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'dashboard')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbarHome}"></div>
        <main class="main-content">
            <h4 class="page-title">监管驾驶舱</h4>
            <div class="row">
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-primary" th:text="${batchTotal}">0</h3><p class="mb-0">总批次</p>
                </div></div></div>
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-warning" th:text="${pendingCount}">0</h3><p class="mb-0">待处理投诉</p>
                </div></div></div>
                <div class="col-md-4"><div class="card text-center"><div class="card-body">
                    <h3 class="text-success" th:text="${complaintTotal}">0</h3><p class="mb-0">累计投诉</p>
                </div></div></div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">📊 各品类产量统计</div>
                        <div class="card-body"><div id="chartBar" style="height:320px"></div></div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">🥧 投诉状态分布</div>
                        <div class="card-body"><div id="chartPie" style="height:320px"></div></div>
                    </div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">📈 近 7 天流转量趋势</div>
                <div class="card-body"><div id="chartLine" style="height:300px"></div></div>
            </div>
        </main>
    </div>
</div>

<script th:inline="javascript">
    // ===== 各品类产量柱状图 =====
    var cropStats = /*[[${cropStats}]]*/ [];
    var chartBar = echarts.init(document.getElementById('chartBar'));
    chartBar.setOption({
        tooltip: { trigger: 'axis', formatter: '{b}：{c} 斤' },
        grid: { left: 60, right: 30, top: 30, bottom: 40 },
        xAxis: { type: 'category', data: cropStats.map(d => d.crop_name) },
        yAxis: { type: 'value', name: '产量(斤)', minInterval: 1 },
        series: [{
            type: 'bar',
            barMaxWidth: 60,
            data: cropStats.map(d => Number(d.total) || 0),
            itemStyle: { color: '#2E7D32', borderRadius: [4, 4, 0, 0] },
            label: { show: true, position: 'top', formatter: '{c} 斤' }
        }]
    });

    // ===== 投诉状态饼图 =====
    var complaintStatus = /*[[${complaintStatus}]]*/ [];
    var statusMap = { 'PENDING': '待处理', 'PROCESSING': '处理中', 'CLOSED': '已关闭' };
    var pieData = complaintStatus.map(d => ({
        name: statusMap[d.status] || d.status,
        value: Number(d.cnt) || 0
    }));
    var chartPie = echarts.init(document.getElementById('chartPie'));
    chartPie.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { bottom: 0 },
        color: ['#FF9800', '#2196F3', '#9E9E9E'],
        series: [{
            type: 'pie',
            radius: ['40%', '70%'],
            center: ['50%', '45%'],
            avoidLabelOverlap: false,
            label: { show: true, formatter: '{b}\n{c}件' },
            data: pieData
        }]
    });

    // ===== 近 7 天流转量折线图 =====
    var trace7days = /*[[${trace7days}]]*/ [];
    // 补全最近 7 天，没有数据的天填 0
    var days = [];
    var dayMap = {};
    trace7days.forEach(function (d) { dayMap[d.day] = Number(d.cnt) || 0; });
    for (var i = 6; i >= 0; i--) {
        var d = new Date();
        d.setDate(d.getDate() - i);
        var key = d.toISOString().slice(0, 10);
        days.push({ label: key.slice(5), value: dayMap[key] || 0 });
    }
    var chartLine = echarts.init(document.getElementById('chartLine'));
    chartLine.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 50, right: 30, top: 30, bottom: 40 },
        xAxis: { type: 'category', data: days.map(d => d.label) },
        yAxis: { type: 'value', name: '次数', minInterval: 1 },
        series: [{
            type: 'line',
            smooth: true,
            symbol: 'circle',
            symbolSize: 8,
            data: days.map(d => d.value),
            itemStyle: { color: '#2E7D32' },
            lineStyle: { width: 3 },
            areaStyle: { color: 'rgba(46,125,50,0.15)' },
            label: { show: true, position: 'top' }
        }]
    });
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
