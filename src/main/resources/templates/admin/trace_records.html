<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>流转记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'trace_records')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('流通监管','流转记录')}"></div>
        <main class="main-content">
            <h4 class="page-title">全平台流转记录（采收 → 入库 → 出库）</h4>
            <form method="get" action="/admin/trace-records" class="d-flex gap-2 mb-3" style="max-width:500px">
                <input type="text" name="keyword" class="form-control" placeholder="搜索批次号/作物名" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a href="/admin/trace-records" class="btn btn-outline-secondary">重置</a>
            </form>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>时间</th><th>批次号</th><th>作物</th><th>环节</th><th>上家</th><th>下家</th><th>数量(斤)</th><th>地点</th><th>备注</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${records}">
                            <td th:text="${#temporals.format(r.operateTime,'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${r.batchNo}"></td>
                            <td th:text="${r.cropName}"></td>
                            <td>
                                <span class="badge bg-info" th:if="${r.type=='HARVEST'}">采收</span>
                                <span class="badge bg-primary" th:if="${r.type=='INBOUND'}">入库</span>
                                <span class="badge bg-warning text-dark" th:if="${r.type=='OUTBOUND'}">出库</span>
                                <span class="badge bg-secondary" th:if="${r.type=='SALE'}">销售</span>
                            </td>
                            <td th:text="${r.fromUserName}"></td>
                            <td th:text="${r.toUserName}"></td>
                            <td th:text="${r.quantity}"></td>
                            <td th:text="${r.location}"></td>
                            <td th:text="${r.remark}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(records)}"><td colspan="9" class="text-muted text-center">暂无流转记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
