<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增账号</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'users')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('系统管理','新增账号')}"></div>
        <main class="main-content">
            <h4 class="page-title">新增账号</h4>
            <div class="card">
                <div class="card-body" style="max-width: 560px;">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/admin/users/add">
                        <div class="mb-3">
                            <label class="form-label">账号角色 <span class="text-danger">*</span></label>
                            <select name="role" class="form-select" required>
                                <option value="farmer">农户</option>
                                <option value="dealer">经销商</option>
                            </select>
                            <div class="form-text">新账号登录后将进入对应角色的功能界面</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">登录账号 <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" placeholder="至少 3 位，用于登录" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">初始密码 <span class="text-danger">*</span></label>
                            <input type="text" name="password" class="form-control" placeholder="至少 6 位，创建后可自行修改" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">真实姓名 / 企业名 <span class="text-danger">*</span></label>
                            <input type="text" name="realName" class="form-control" placeholder="如：张建国 / 绿丰果蔬批发" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">联系电话</label>
                            <input type="text" name="phone" class="form-control" placeholder="选填">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">地址</label>
                            <input type="text" name="address" class="form-control" placeholder="选填">
                        </div>
                        <button type="submit" class="btn btn-success">保 存</button>
                        <a href="/admin/users" class="btn btn-outline-secondary">返 回</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
