<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>投诉处理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('admin', 'complaints')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('投诉管理','投诉工单')}"></div>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="page-title mb-0">投诉工单</h4>
                <a href="/admin/complaints/export" class="btn btn-success btn-sm">📥 导出 Excel</a>
            </div>
            <form method="get" action="/admin/complaints" class="d-flex gap-2 mb-3" style="max-width:500px">
                <input type="text" name="keyword" class="form-control" placeholder="搜索投诉人/手机号/作物" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a href="/admin/complaints" class="btn btn-outline-secondary">重置</a>
            </form>
            <div th:each="c : ${complaints}" class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <b th:text="${c.type}"></b>
                        <span th:if="${c.status=='PENDING'}" class="badge bg-danger">待处理</span>
                        <span th:if="${c.status=='PROCESSING'}" class="badge bg-warning text-dark">处理中</span>
                        <span th:if="${c.status=='CLOSED'}" class="badge bg-success">已关闭</span>
                    </div>
                    <p class="mt-2">投诉人：<span th:text="${c.complainant}"></span> ｜ 电话：<span th:text="${c.phone}"></span></p>
                    <p>关联批次：<span th:text="${c.batchNo}"></span>（<span th:text="${c.cropName}"></span>）</p>
                    <p>内容：<span th:text="${c.content}"></span></p>
                    <p class="text-muted small mb-2" th:text="${c.createTime}"></p>

                    <!-- 处理区：仅未办结工单显示回复表单 -->
                    <form th:if="${c.status != 'CLOSED'}" method="post" th:action="'/admin/complaints/' + ${c.id} + '/reply'">
                        <div class="input-group">
                            <input type="text" name="reply" class="form-control"
                                   th:placeholder="${c.status=='PENDING' ? '填写处理回复' : '追加回复（可选）'}" required>
                            <select name="status" class="form-select" style="max-width:130px">
                                <option value="PROCESSING" th:selected="${c.status=='PENDING'}">标记处理中</option>
                                <option value="CLOSED" th:selected="${c.status=='PROCESSING'}">关闭工单</option>
                            </select>
                            <button class="btn btn-primary">提交</button>
                        </div>
                    </form>

                    <!-- 管理员回复记录（带时间） -->
                    <div th:if="${c.reply != null}" class="mt-2 p-2 rounded"
                         style="background:#f6faf6;border:1px solid #e3efe4">
                        <div class="small text-success mb-1">
                            管理员回复
                            <span class="text-muted ms-2" th:text="${c.replyTime}"></span>
                        </div>
                        <div th:text="${c.reply}"></div>
                    </div>

                    <!-- 消费者确认（办结闭环） -->
                    <div th:if="${c.consumerReply != null}" class="mt-2 p-2 rounded"
                         style="background:#f0f7ff;border:1px solid #dbeafe">
                        <div class="small text-primary mb-1">
                            消费者已确认满意
                            <span class="text-muted ms-2" th:text="${c.consumerReplyTime}"></span>
                        </div>
                        <div th:text="${c.consumerReply}"></div>
                    </div>

                    <!-- 办结横幅 -->
                    <div th:if="${c.status == 'CLOSED'}" class="alert alert-success py-2 mt-2 mb-0 small">
                        ✓ 本工单已办结关闭，无需再处理
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(complaints)}" class="text-muted">暂无投诉工单</div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
