<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统提示 - 安溯·知源</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f0f4f0, #e8f5e9); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 48px 40px; text-align: center; max-width: 420px; width: 90%; }
        .error-icon { font-size: 56px; margin-bottom: 16px; }
        .error-title { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .error-msg { color: #666; font-size: 14px; margin-bottom: 28px; line-height: 1.6; }
        .btn-back { background: #2E7D32; color: #fff; border: none; padding: 10px 32px; border-radius: 8px; font-size: 14px; }
        .btn-back:hover { background: #1B5E20; color: #fff; }
        .btn-login { background: #fff; color: #2E7D32; border: 1px solid #2E7D32; padding: 10px 28px; border-radius: 8px; font-size: 14px; text-decoration: none; }
        .btn-login:hover { background: #f0f4f0; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon">⚠️</div>
    <div class="error-title" th:text="${title}">出错了</div>
    <div class="error-msg" th:text="${msg}">操作出现异常</div>
    <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-back" onclick="history.back()">← 返回</button>
        <a th:if="${showLogin}" href="/login" class="btn btn-login">去登录</a>
    </div>
</div>
</body>
</html>
