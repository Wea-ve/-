<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>农芯溯源 - 提交投诉</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .top-banner { background: linear-gradient(135deg,#2E7D32,#1B5E20); color:#fff; padding:20px; text-align:center; }
        .brand { font-size: 13px; letter-spacing: 2px; opacity: .85; margin-bottom: 8px; }
        .container { max-width: 560px; margin-top: 16px; }
        .form-card { border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); border: none; }
        .form-card .card-body { padding: 24px; }
        .btn-green { background: linear-gradient(135deg,#43A047,#2E7D32); color:#fff; border:none; border-radius:10px; padding:10px 0; width:100%; font-weight:600; letter-spacing:4px; }
        .btn-green:hover { background: linear-gradient(135deg,#388E3C,#1B5E20); color:#fff; }
        .back-link { color: #2E7D32; text-decoration: none; font-size: 13px; }
        .back-link:hover { text-decoration: underline; }
        .required::after { content: " *"; color: #dc3545; }
        @media (max-width: 768px) {
            .container { padding: 0 10px; }
            .top-banner { padding: 14px; }
            .top-banner h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="top-banner">
    <div class="brand">🌾 农芯溯源 · 农产品全链路溯源</div>
    <h3>📢 提交投诉</h3>
    <p class="mb-0 small opacity-75">我们重视每一位消费者的反馈，提交后可凭查询码查看处理进度</p>
</div>

<div class="container">
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <div class="card form-card mb-3">
        <div class="card-body">
            <form method="post" action="/complaint">
                <div class="mb-3">
                    <label class="form-label required">您的称呼</label>
                    <input type="text" name="complainant" class="form-control" placeholder="如：王女士" required>
                </div>
                <div class="mb-3">
                    <label class="form-label required">联系电话</label>
                    <input type="tel" name="phone" class="form-control" placeholder="请输入手机号（用于查询处理进度）" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">投诉类型</label>
                    <select name="type" class="form-select">
                        <option>品质问题</option>
                        <option>农残担忧</option>
                        <option>假冒问题</option>
                        <option>服务问题</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">关联溯源码（可选）</label>
                    <input type="text" name="batchId" class="form-control" placeholder="如产品包装上的溯源码，不填可留空">
                    <div class="form-text">如有溯源码可帮助我们快速定位问题批次</div>
                </div>
                <div class="mb-3">
                    <label class="form-label required">投诉内容</label>
                    <textarea name="content" class="form-control" rows="4" placeholder="请详细描述您遇到的问题..." required></textarea>
                </div>
                <button type="submit" class="btn-green">提 交 投 诉</button>
            </form>
        </div>
    </div>

    <div class="text-center">
        <a href="/complaint/query" class="back-link">🔍 已有投诉？查询处理进度</a>
        <span class="mx-2 text-muted">|</span>
        <a href="/" class="back-link">← 返回首页</a>
    </div>
</div>
</body>
</html>
