<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>农芯溯源 - 我的投诉</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .top-banner { background: linear-gradient(135deg,#2E7D32,#1B5E20); color:#fff; padding:20px; text-align:center; }
        .brand { font-size: 13px; letter-spacing: 2px; opacity: .85; margin-bottom: 8px; }
        .container { max-width: 640px; margin-top: 16px; }
        .search-card { border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); border: none; }
        .search-card .card-body { padding: 20px; }
        .btn-green { background: linear-gradient(135deg,#43A047,#2E7D32); color:#fff; border:none; border-radius:10px; padding:9px 22px; font-weight:600; }
        .btn-green:hover { background: linear-gradient(135deg,#388E3C,#1B5E20); color:#fff; }
        .complaint-card { border-radius: 12px; margin-bottom: 14px; border: 1px solid #e8e8e8; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .complaint-card .card-body { padding: 16px; }
        .status-PENDING { background:#dc3545; }
        .status-PROCESSING { background:#ffc107; color:#333; }
        .status-CLOSED { background:#28a745; }
        .reply-box { background: #f0f9f0; border-left: 3px solid #43A047; padding: 10px 14px; border-radius: 6px; margin-top: 10px; }
        .reply-box .label { color: #2E7D32; font-weight: 600; font-size: 13px; }
        .empty-tip { text-align:center; color:#999; padding: 40px 20px; }
        .back-link { color: #2E7D32; text-decoration: none; font-size: 13px; }
        .back-link:hover { text-decoration: underline; }
        .code-badge { background: #E8F5E9; color: #2E7D32; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-family: monospace; }
        @media (max-width: 768px) {
            .container { padding: 0 10px; }
            .top-banner { padding: 14px; }
            .top-banner h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="top-banner">
    <div class="brand">🌾 农芯溯源 · 农产品全链路溯源</div>
    <h3>📢 我的投诉查询</h3>
    <p class="mb-0 small opacity-75">输入投诉时填写的手机号，或投诉成功后获得的查询码</p>
</div>

<div class="container">
    <!-- 搜索框 -->
    <div class="card search-card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small">输入手机号或查询码查询处理进度</span>
                <a href="/complaint/new" class="btn btn-success btn-sm">📢 我要投诉</a>
            </div>
            <form method="post" action="/complaint/query">
                <div class="d-flex gap-2">
                    <input type="text" name="keyword" class="form-control"
                           placeholder="手机号 或 查询码（如 13900000001 / 3）"
                           th:value="${keyword}" required>
                    <button type="submit" class="btn btn-green">查询</button>
                </div>
                <div class="mt-2">
                    <a href="/" class="back-link">← 返回首页</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 提交成功提示 -->
    <div th:if="${param.submitted != null}" class="alert alert-success">
        ✅ 投诉已提交成功！您的查询码为 <b th:text="'#' + ${param.cid[0]}"></b>，
        下方已显示该投诉记录，请留意处理回复。
    </div>

    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <!-- 查询结果 -->
    <div th:if="${complaints != null}">
        <div th:if="${#lists.isEmpty(complaints)}" class="card empty-tip">
            <div style="font-size:40px;">🔍</div>
            <div class="mt-2">未查询到相关投诉记录</div>
            <div class="small text-muted">请确认手机号或查询码是否正确</div>
        </div>

        <div th:each="c : ${complaints}" class="card complaint-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <b th:text="${c.type}"></b>
                        <span class="ms-2 code-badge" th:text="'#' + ${c.id}"></span>
                    </div>
                    <span class="badge" th:classappend="'status-' + ${c.status}"
                          th:text="${c.status == 'PENDING'} ? '待处理' :
                                    (${c.status == 'PROCESSING'} ? '处理中' : '已关闭')"></span>
                </div>
                <p class="mt-2 mb-1">
                    关联批次：<span th:text="${c.batchNo} ?: '—'"></span>
                    （<span th:text="${c.cropName} ?: '—'"></span>）
                </p>
                <p class="mb-1">投诉人：<span th:text="${c.complainant}"></span> ｜ 电话：<span th:text="${c.phone}"></span></p>
                <p class="mb-1">投诉内容：<span th:text="${c.content}"></span></p>
                <p class="text-muted small mb-0">提交时间：<span th:text="${c.createTime}"></span></p>

                <!-- 管理员处理方案（处理中/已关闭时显示） -->
                <div th:if="${c.reply != null and !#strings.isEmpty(c.reply)}" class="reply-box">
                    <div class="label">💬 处理方案</div>
                    <div class="mt-1" th:text="${c.reply}"></div>
                    <div class="text-muted small mt-1" th:if="${c.replyTime != null}">
                        回复时间：<span th:text="${c.replyTime}"></span>
                    </div>
                </div>

                <!-- 待处理：暂无回复 -->
                <div th:if="${c.status == 'PENDING'}" class="reply-box" style="background:#fff8e1; border-left-color:#ffc107;">
                    <div class="label" style="color:#b8860b;">⏳ 待处理</div>
                    <div class="mt-1 small text-muted">工作人员正在处理中，请稍后再来查询</div>
                </div>

                <!-- 处理中：消费者确认回复表单 -->
                <div th:if="${c.status == 'PROCESSING'}" class="reply-box mt-2" style="background:#e3f2fd; border-left-color:#2196f3;">
                    <div class="label" style="color:#1565c0;">📝 请确认处理方案</div>
                    <form method="post" th:action="@{/complaint/{id}/confirm(id=${c.id})}" class="mt-2">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        <div class="d-flex gap-2">
                            <input type="text" name="consumerReply" class="form-control form-control-sm"
                                   placeholder="如对处理方案无异议，请填写确认（如：已解决、无异议）" required>
                            <button type="submit" class="btn btn-primary btn-sm">确认并关闭</button>
                        </div>
                    </form>
                </div>

                <!-- 已关闭：显示消费者确认回复 -->
                <div th:if="${c.status == 'CLOSED' and c.consumerReply != null and !#strings.isEmpty(c.consumerReply)}" class="reply-box mt-2" style="background:#e8f5e9; border-left-color:#43a047;">
                    <div class="label" style="color:#2e7d32;">✅ 消费者已确认</div>
                    <div class="mt-1" th:text="${c.consumerReply}"></div>
                    <div class="text-muted small mt-1" th:if="${c.consumerReplyTime != null}">
                        确认时间：<span th:text="${c.consumerReplyTime}"></span>
                    </div>
                </div>
                <div th:if="${c.status == 'CLOSED' and (c.consumerReply == null or #strings.isEmpty(c.consumerReply))}" class="reply-box mt-2" style="background:#e8f5e9; border-left-color:#43a047;">
                    <div class="label" style="color:#2e7d32;">✅ 工单已关闭</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 初始状态提示 -->
    <div th:if="${complaints == null}" class="card empty-tip">
        <div style="font-size:40px;">📋</div>
        <div class="mt-2">请输入手机号或查询码查询投诉处理进度</div>
    </div>
</div>
</body>
</html>
