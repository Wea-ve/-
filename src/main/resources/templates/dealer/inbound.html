<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>扫码收货</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'inbound')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('收货管理','扫码收货')}"></div>
        <main class="main-content" style="max-width:680px">
            <h4 class="page-title">扫码/输入溯源码收货</h4>
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" action="/dealer/inbound">
                        <div class="input-group">
                            <input type="text" name="traceCode" class="form-control" placeholder="输入溯源码，如 TZ2026...">
                            <button class="btn btn-primary">查询</button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${param.success != null}" class="alert alert-success">收货成功，流转记录已上链</div>

            <div th:if="${batch != null}" class="card">
                <div class="card-body">
                    <h5>批次信息确认</h5>
                    <p>作物：<b th:text="${batch.cropName}"></b></p>
                    <p>产地：<span th:text="${batch.landLocation}"></span></p>
                    <p>农户：<span th:text="${batch.farmerName}"></span></p>
                    <p>采收量：<span th:text="${batch.harvestWeight}"></span> 斤</p>
                    <form method="post" action="/dealer/inbound">
                        <input type="hidden" name="batchId" th:value="${batch.id}">
                        <div class="mb-3">
                            <label class="form-label">本次收货数量（斤）</label>
                            <input type="number" step="0.01" name="quantity" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success">确认收货入库</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
