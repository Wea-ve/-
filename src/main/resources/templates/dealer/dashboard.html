<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>经销商工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'dashboard')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbarHome}"></div>
        <main class="main-content">
            <h4 class="page-title">待收货批次（已采收）</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>产地</th><th>农户</th><th>采收量</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${available}">
                            <td th:text="${b.batchNo}"></td>
                            <td th:text="${b.cropName}"></td>
                            <td th:text="${b.landLocation}"></td>
                            <td th:text="${b.farmerName}"></td>
                            <td th:text="${b.harvestWeight}"></td>
                            <td><a th:href="'/dealer/inbound?traceCode=' + ${b.traceCode}" class="btn btn-sm btn-primary">收货</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(available)}"><td colspan="6" class="text-muted text-center">暂无待收货批次</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
