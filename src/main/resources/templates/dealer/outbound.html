<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>出货登记</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'outbound')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('出货管理','出货登记')}"></div>
        <main class="main-content">
            <h4 class="page-title">出货登记</h4>
            <div th:if="${param.success != null}" class="alert alert-success">出库成功</div>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>溯源码</th><th>数量</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${list}">
                            <td th:text="${b.batchNo}"></td>
                            <td th:text="${b.cropName}"></td>
                            <td th:text="${b.traceCode}"></td>
                            <td th:text="${b.harvestWeight}"></td>
                            <td>
                                <button class="btn btn-sm btn-warning" data-bs-toggle="modal" th:data-bs-target="'#m' + ${b.id}">出货</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(list)}"><td colspan="5" class="text-muted text-center">暂无可出库批次</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:each="b : ${list}" th:id="'m' + ${b.id}" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="/dealer/outbound">
                <div class="modal-header"><h5 class="modal-title">出货 - <span th:text="${b.cropName}"></span></h5></div>
                <div class="modal-body">
                    <input type="hidden" name="batchId" th:value="${b.id}">
                    <div class="mb-3"><label>数量（斤）</label>
                        <input type="number" step="0.01" name="quantity" class="form-control" required></div>
                    <div class="mb-3"><label>下游客户</label>
                        <input type="text" name="toName" class="form-control" required></div>
                    <div class="mb-3"><label>交货地点</label>
                        <input type="text" name="location" class="form-control" required></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-warning">确认出库</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
