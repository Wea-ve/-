<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>经手批次</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'records')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('批次库存','经手批次')}"></div>
        <main class="main-content">
            <h4 class="page-title">我经手的批次</h4>
            <form method="get" action="/dealer/records" class="d-flex gap-2 mb-3" style="max-width:500px">
                <input type="text" name="keyword" class="form-control" placeholder="搜索批次号/作物名" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a href="/dealer/records" class="btn btn-outline-secondary">重置</a>
            </form>
            <div th:each="b : ${batches}" class="card mb-3">
                <div class="card-header">
                    <b th:text="${b.batchNo}"></b> - <span th:text="${b.cropName}"></span>
                    <span th:if="${b.status=='HARVESTED'}" class="badge bg-success float-end">已采收</span>
                    <span th:if="${b.status=='SOLD'}" class="badge bg-secondary float-end">已售罄</span>
                </div>
                <div class="card-body">
                    <p class="mb-1">产地：<span th:text="${b.landLocation}"></span></p>
                    <p class="mb-1">农户：<span th:text="${b.farmerName}"></span></p>
                    <p class="mb-0">溯源码：
                        <a th:if="${b.traceCode != null}" th:href="'/trace/' + ${b.traceCode}" target="_blank" th:text="${b.traceCode}"></a>
                        <span th:if="${b.traceCode == null}">—</span>
                    </p>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(batches)}" class="text-muted">暂无经手记录</div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
