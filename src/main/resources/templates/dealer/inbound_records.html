<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>入库记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'inbound_records')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('收货管理','入库记录')}"></div>
        <main class="main-content">
            <h4 class="page-title">入库记录</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>入库时间</th><th>批次号</th><th>作物</th><th>来源农户</th><th>数量(斤)</th><th>地点</th><th>备注</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${records}">
                            <td th:text="${#temporals.format(r.operateTime,'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${r.batchNo}"></td>
                            <td th:text="${r.cropName}"></td>
                            <td th:text="${r.fromUserName}"></td>
                            <td th:text="${r.quantity}"></td>
                            <td th:text="${r.location}"></td>
                            <td th:text="${r.remark}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(records)}"><td colspan="7" class="text-muted text-center">暂无入库记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
