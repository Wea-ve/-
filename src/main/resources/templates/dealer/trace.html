<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>溯源查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('dealer', 'trace_query')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('批次库存','溯源查询')}"></div>
        <main class="main-content" style="max-width:760px">
            <h4 class="page-title">溯源查询</h4>
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" action="/dealer/trace">
                        <div class="input-group">
                            <input type="text" name="traceCode" class="form-control" placeholder="输入溯源码，如 TZ2026..." th:value="${traceCode}">
                            <button class="btn btn-primary">查询</button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${batch != null}" class="card">
                <div class="card-header">
                    <span th:text="${batch.cropName}"></span>（<span th:text="${batch.batchNo}"></span>）
                </div>
                <div class="card-body">
                    <p>品种：<span th:text="${batch.variety}"></span></p>
                    <p>产地：<span th:text="${batch.landLocation}"></span></p>
                    <p>种植农户：<span th:text="${batch.farmerName}"></span></p>
                    <p>采收重量：<span th:text="${batch.harvestWeight}"></span> 斤</p>
                    <p>溯源码：<b th:text="${batch.traceCode}"></b></p>
                    <a th:href="'/trace/' + ${batch.traceCode}" target="_blank" class="btn btn-success">查看完整溯源链路（消费者页面）</a>
                </div>
            </div>
            <div th:if="${traceCode != null && batch == null}" class="alert alert-warning">未查询到该溯源码对应的批次</div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
