<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>农事记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'logs')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('农事管理','农事记录')}"></div>
        <main class="main-content">
            <h4 class="page-title">农事记录</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>日期</th><th>批次</th><th>作物</th><th>类型</th><th>物料</th><th>用量</th><th>说明</th></tr></thead>
                        <tbody>
                        <tr th:each="l : ${logs}">
                            <td th:text="${l.logDate}"></td>
                            <td th:text="${l.batchNo}"></td>
                            <td th:text="${l.cropName}"></td>
                            <td>
                                <span class="badge bg-info"
                                      th:text="${l.logType == 'SOWING' ? '播种' : (l.logType == 'FERTILIZE' ? '施肥' : (l.logType == 'PESTICIDE' ? '打药' : (l.logType == 'IRRIGATE' ? '灌溉' : '除草')))}"></span>
                            </td>
                            <td th:text="${l.material}"></td>
                            <td th:text="${l.dosage}"></td>
                            <td th:text="${l.content}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}"><td colspan="7" class="text-muted text-center">暂无农事记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <p class="mt-2 text-muted">提示：录入新农事操作请前往「种植管理 - 我的批次」，在对应批次中添加。</p>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
