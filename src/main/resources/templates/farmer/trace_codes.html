<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>溯源码管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'trace_codes')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('采收溯源','溯源码管理')}"></div>
        <main class="main-content">
            <h4 class="page-title">溯源码管理</h4>
            <div th:each="b : ${batches}" class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h5 th:text="${b.cropName} + '（' + ${b.variety} + '）'">作物</h5>
                            <p class="mb-1 text-muted">批次号：<b th:text="${b.batchNo}"></b></p>
                            <p class="mb-1">状态：
                                <span th:if="${b.status=='PLANTING'}" class="badge bg-warning">种植中</span>
                                <span th:if="${b.status=='HARVESTED'}" class="badge bg-success">已采收</span>
                                <span th:if="${b.status=='SOLD'}" class="badge bg-secondary">已售罄</span>
                            </p>
                            <div th:if="${b.traceCode != null}">
                                <p class="mb-1">溯源码：<b th:text="${b.traceCode}"></b></p>
                                <p class="mb-0">消费者扫码地址：
                                    <a th:href="${baseUrl} + '/trace/' + ${b.traceCode}" target="_blank"
                                       th:text="${baseUrl} + '/trace/' + ${b.traceCode}"></a>
                                </p>
                            </div>
                        </div>
                        <div class="text-end">
                            <div th:if="${b.traceCode != null}">
                                <!-- 二维码由后端动态生成：自动使用当前局域网 IP，换 WiFi/热点无需改代码 -->
                                <img th:src="'/qrcode?code=' + ${b.traceCode}"
                                     style="width:150px;height:150px;border:1px solid #eee;padding:4px">
                                <div class="mt-1 small text-muted">手机扫码访问</div>
                            </div>
                            <div th:if="${b.status=='PLANTING'}" class="mt-2">
                                <a th:href="'/farmer/batch/' + ${b.id} + '/harvest'" class="btn btn-success btn-sm">采收并生成溯源码</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(batches)}" class="text-muted">暂无批次，请先新建种植批次</div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
