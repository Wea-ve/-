<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发货记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'sales')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('销售记录','发货记录')}"></div>
        <main class="main-content">
            <h4 class="page-title">发货记录（我的批次被经销商收货/出货情况）</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>时间</th><th>批次号</th><th>作物</th><th>环节</th><th>数量(斤)</th><th>收货方</th><th>地点</th><th>备注</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${records}">
                            <td th:text="${#temporals.format(r.operateTime,'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${r.batchNo}"></td>
                            <td th:text="${r.cropName}"></td>
                            <td>
                                <span class="badge bg-primary" th:if="${r.type=='INBOUND'}">经销商入库</span>
                                <span class="badge bg-warning text-dark" th:if="${r.type=='OUTBOUND'}">经销商出库</span>
                                <span class="badge bg-secondary" th:if="${r.type=='SALE'}">销售</span>
                            </td>
                            <td th:text="${r.quantity}"></td>
                            <td th:text="${r.toUserName}"></td>
                            <td th:text="${r.location}"></td>
                            <td th:text="${r.remark}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(records)}"><td colspan="8" class="text-muted text-center">暂无发货记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
