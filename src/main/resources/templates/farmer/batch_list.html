<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批次列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'batch')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('种植管理','我的批次')}"></div>
        <main class="main-content">
            <h4 class="page-title">我的种植批次</h4>
            <form method="get" action="/farmer/batch" class="d-flex gap-2 mb-3" style="max-width:500px">
                <input type="text" name="keyword" class="form-control" placeholder="搜索批次号/作物名" th:value="${keyword}">
                <button class="btn btn-outline-success">搜索</button>
                <a href="/farmer/batch" class="btn btn-outline-secondary">重置</a>
            </form>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>产地</th><th>播种日期</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${batches}">
                            <td th:text="${b.batchNo}"></td>
                            <td th:text="${b.cropName}"></td>
                            <td th:text="${b.landLocation}"></td>
                            <td th:text="${b.plantDate}"></td>
                            <td>
                                <span th:if="${b.status=='PLANTING'}" class="badge bg-warning">种植中</span>
                                <span th:if="${b.status=='HARVESTED'}" class="badge bg-success">已采收</span>
                                <span th:if="${b.status=='SOLD'}" class="badge bg-secondary">已售罄</span>
                            </td>
                            <td>
                                <a th:href="'/farmer/batch/' + ${b.id} + '/logs'" class="btn btn-sm btn-outline-primary">农事记录</a>
                                <a th:if="${b.status=='PLANTING'}" th:href="'/farmer/batch/' + ${b.id} + '/harvest'" class="btn btn-sm btn-outline-success">采收生成码</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
