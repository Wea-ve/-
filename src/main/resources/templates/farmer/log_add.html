<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>录入农事操作</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'logs')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('农事管理','录入农事操作')}"></div>
        <main class="main-content" style="max-width:680px">
            <h4 class="page-title">录入农事操作</h4>
            <div class="card">
                <div class="card-body">
                    <form method="post" th:action="'/farmer/batch/' + ${batchId} + '/log/add'">
                        <div class="mb-3">
                            <label class="form-label">操作类型</label>
                            <select name="logType" class="form-select" required>
                                <option value="SOWING">播种</option>
                                <option value="FERTILIZE">施肥</option>
                                <option value="PESTICIDE">打药</option>
                                <option value="IRRIGATE">灌溉</option>
                                <option value="WEED">除草</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">操作日期</label>
                            <input type="date" name="logDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">使用物料（肥料/农药名）</label>
                            <input type="text" name="material" class="form-control" placeholder="如：吡虫啉 / 复合肥">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">用量</label>
                            <input type="text" name="dosage" class="form-control" placeholder="如：20g/亩">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">操作描述</label>
                            <textarea name="content" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">提交记录</button>
                        <a th:href="'/farmer/batch/' + ${batchId} + '/logs'" class="btn btn-secondary">返回</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
