<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>采收生成溯源码</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'trace_codes')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('采收溯源','采收登记')}"></div>
        <main class="main-content" style="max-width:680px">
            <h4 class="page-title">采收并生成溯源码</h4>
            <p class="text-muted">作物：<span th:text="${batch.cropName}"></span> ｜ 批次：<span th:text="${batch.batchNo}"></span></p>
            <div class="card">
                <div class="card-body">
                    <form method="post" th:action="'/farmer/batch/' + ${batch.id} + '/harvest'">
                        <div class="mb-3">
                            <label class="form-label">实际采收日期</label>
                            <input type="date" name="actualHarvestDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">采收重量（斤）</label>
                            <input type="number" step="0.01" name="harvestWeight" class="form-control" required>
                        </div>
                        <div class="alert alert-warning">
                            提交后系统将自动生成唯一溯源码和二维码图片，请打印贴在包装上。
                        </div>
                        <button type="submit" class="btn btn-success">生成溯源码</button>
                        <a href="/farmer/trace-codes" class="btn btn-secondary">取消</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
