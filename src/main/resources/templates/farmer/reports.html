<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>检测报告</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'reports')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('采收溯源','检测报告')}"></div>
        <main class="main-content">
            <h4 class="page-title">上传检测报告</h4>
            <div class="card mb-4">
                <div class="card-body">
                    <form method="post" action="/farmer/reports" enctype="multipart/form-data">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">所属批次</label>
                                <select name="batchId" class="form-select" required>
                                    <option th:each="b : ${batches}" th:value="${b.id}"
                                            th:text="${b.batchNo + ' - ' + b.cropName}"></option>
                                </select>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">报告编号</label>
                                <input type="text" name="reportNo" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">检测机构</label>
                                <input type="text" name="institution" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">检测日期</label>
                                <input type="date" name="reportDate" class="form-control">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label class="form-label">检测结果</label>
                                <select name="result" class="form-select" required>
                                    <option value="合格">合格</option>
                                    <option value="不合格">不合格</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">报告文件（PDF/图片）</label>
                                <input type="file" name="file" class="form-control" accept=".pdf,.png,.jpg,.jpeg">
                            </div>
                            <div class="col-md-3 mb-3 d-flex align-items-end">
                                <button class="btn btn-success w-100">上传报告</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <h4 class="page-title">已上传报告</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>报告编号</th><th>检测机构</th><th>日期</th><th>结果</th><th>文件</th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${reports}">
                            <td th:text="${r.batchNo}"></td>
                            <td th:text="${r.cropName}"></td>
                            <td th:text="${r.reportNo}"></td>
                            <td th:text="${r.institution}"></td>
                            <td th:text="${r.reportDate}"></td>
                            <td>
                                <span class="badge" th:classappend="${r.result == '合格'} ? 'bg-success' : 'bg-danger'"
                                      th:text="${r.result}"></span>
                            </td>
                            <td>
                                <a th:if="${r.reportUrl != null}" th:href="${r.reportUrl}" target="_blank" class="btn btn-sm btn-outline-primary">查看</a>
                                <span th:if="${r.reportUrl == null}" class="text-muted">无</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reports)}"><td colspan="7" class="text-muted text-center">暂无检测报告</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
