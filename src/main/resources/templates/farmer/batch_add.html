<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新建种植批次</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'batch_add')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('种植管理','新建批次')}"></div>
        <main class="main-content" style="max-width:680px">
            <h4 class="page-title">新建种植批次</h4>
            <div class="card">
                <div class="card-body">
                    <form method="post" action="/farmer/batch/add">
                        <div class="mb-3">
                            <label class="form-label">作物名称</label>
                            <input type="text" name="cropName" class="form-control" required placeholder="如：西红柿/黄瓜">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">品种</label>
                            <input type="text" name="variety" class="form-control" placeholder="如：粉冠一号">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">产地/地块位置</label>
                            <input type="text" name="landLocation" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">播种日期</label>
                            <input type="date" name="plantDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">预计采收日期</label>
                            <input type="date" name="expectHarvestDate" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success">提交</button>
                        <a href="/farmer/batch" class="btn btn-secondary">返回</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
