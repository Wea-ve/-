<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>农事记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'logs')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbar('农事管理','批次农事记录')}"></div>
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="page-title">批次农事记录 - <span th:text="${batch.cropName}"></span></h4>
                <a th:href="'/farmer/batch/' + ${batch.id} + '/log/add'" class="btn btn-success">+ 录入农事操作</a>
            </div>
            <p class="text-muted">批次号：<span th:text="${batch.batchNo}"></span></p>

            <div th:if="${batch.traceCode != null}" class="card mb-3">
                <div class="card-body">
                    <h5>溯源二维码</h5>
                    <img th:src="'/qrcode?code=' + ${batch.traceCode}" style="width:200px;height:200px">
                    <p class="mt-2 mb-0">溯源码：<b th:text="${batch.traceCode}"></b></p>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <table class="table mb-0">
                        <thead><tr><th>日期</th><th>类型</th><th>物料</th><th>用量</th><th>说明</th></tr></thead>
                        <tbody>
                        <tr th:each="l : ${logs}">
                            <td th:text="${l.logDate}"></td>
                            <td>
                                <span class="badge bg-info"
                                      th:text="${l.logType} == 'SOWING' ? '播种' :
                                          (${l.logType} == 'FERTILIZE' ? '施肥' :
                                          (${l.logType} == 'PESTICIDE' ? '打药' :
                                          (${l.logType} == 'IRRIGATE' ? '灌溉' : '除草')))"></span>
                            </td>
                            <td th:text="${l.material}"></td>
                            <td th:text="${l.dosage}"></td>
                            <td th:text="${l.content}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <a href="/farmer/logs" class="btn btn-link mt-2">返回全部农事记录</a>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
