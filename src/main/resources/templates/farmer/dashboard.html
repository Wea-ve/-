<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>农户工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/layout.css?v=202610184" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/layout :: sidebar('farmer', 'dashboard')}"></div>
    <div class="content-wrapper">
        <div th:replace="~{fragments/layout :: topbarHome}"></div>
        <main class="main-content">
            <h4 class="page-title">工作台</h4>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-center"><div class="card-body">
                        <h5 class="text-success" th:text="${plantingCount}">0</h5>
                        <p class="text-muted mb-0">种植中批次</p>
                    </div></div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center"><div class="card-body">
                        <h5 class="text-primary" th:text="${harvestedCount}">0</h5>
                        <p class="text-muted mb-0">已采收批次</p>
                    </div></div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center"><div class="card-body">
                        <a href="/farmer/batch/add" class="btn btn-success">+ 新建种植批次</a>
                    </div></div>
                </div>
            </div>

            <div class="card mt-4">
                <div class="card-header">🥧 各作物采收重量占比</div>
                <div class="card-body"><div id="pieChart" style="height:300px"></div></div>
            </div>

            <h4 class="mt-4 page-title">我的种植批次</h4>
            <div class="card">
                <div class="card-body">
                    <table class="table table-striped mb-0">
                        <thead><tr><th>批次号</th><th>作物</th><th>播种日期</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="b : ${batches}">
                            <td th:text="${b.batchNo}"></td>
                            <td th:text="${b.cropName}"></td>
                            <td th:text="${b.plantDate}"></td>
                            <td>
                                <span th:if="${b.status=='PLANTING'}" class="badge bg-warning">种植中</span>
                                <span th:if="${b.status=='HARVESTED'}" class="badge bg-success">已采收</span>
                                <span th:if="${b.status=='SOLD'}" class="badge bg-secondary">已售罄</span>
                            </td>
                            <td>
                                <a th:href="'/farmer/batch/' + ${b.id} + '/logs'" class="btn btn-sm btn-outline-primary">农事记录</a>
                                <a th:if="${b.status=='PLANTING'}" th:href="'/farmer/batch/' + ${b.id} + '/harvest'" class="btn btn-sm btn-outline-success">采收生成码</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:inline="javascript">
    var cropStats = /*[[${cropStats}]]*/ {};
    var pieData = Object.keys(cropStats).map(function (k) {
        return { name: k, value: Number(cropStats[k]) || 0 };
    });
    var pieChart = echarts.init(document.getElementById('pieChart'));
    pieChart.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} 斤 ({d}%)' },
        legend: { bottom: 0 },
        color: ['#2E7D32', '#66BB6A', '#A5D6A7', '#FFB74D', '#4FC3F7', '#BA68C8'],
        series: [{
            type: 'pie',
            radius: ['40%', '70%'],
            center: ['50%', '45%'],
            label: { show: true, formatter: '{b}\n{c} 斤' },
            data: pieData.length > 0 ? pieData : [{ name: '暂无采收数据', value: 1, itemStyle: { color: '#ccc' } }]
        }]
    });
</script>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
